# Builds the Windows and Mac zips on GitHub's machines. Run it from the Actions tab
# ("Run workflow"); the zips appear under the run as "LoopsMaster-Windows" and "LoopsMaster-Mac".
# For signed Mac builds add these repository secrets: MAC_CERT_P12 (base64 of a Developer ID
# Application .p12), MAC_CERT_PASSWORD, MAC_SIGN_ID, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD.
name: release
on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    env:
      HAS_CERT: ${{ secrets.MAC_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          P12: ${{ secrets.MAC_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          echo "$P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          xcrun notarytool store-credentials ci --apple-id "${{ secrets.APPLE_ID }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" --password "${{ secrets.APPLE_APP_PASSWORD }}"
          echo "SIGN_ID=${{ secrets.MAC_SIGN_ID }}" >> "$GITHUB_ENV"
          echo "NOTARY_PROFILE=ci" >> "$GITHUB_ENV"
      - run: bash tools/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LoopsMaster-Mac
          path: dist/LoopsMaster-*-Mac.zip

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Get the VST 3 SDK if it is not in the repository
        shell: bash
        run: |
          [ -f external/vst3sdk/CMakeLists.txt ] || git clone --recursive --depth 1 \
            --branch v3.8.1_build_84 https://github.com/steinbergmedia/vst3sdk.git external/vst3sdk
      - run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - run: cmake --build build --config Release --target LoopsMaster dsp_test
      - run: build\bin\Release\dsp_test.exe
      - name: Zip
        shell: pwsh
        run: |
          $v = (Select-String CMakeLists.txt -Pattern 'project\(LoopsMaster VERSION ([0-9.]+)\)').Matches[0].Groups[1].Value
          $stage = "dist\stage-win\LoopsMaster $v Windows"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item build\VST3\Release\LoopsMaster.vst3 $stage -Recurse
          Remove-Item "$stage\LoopsMaster.vst3\desktop.ini","$stage\LoopsMaster.vst3\PlugIn.ico" -ErrorAction SilentlyContinue
          Copy-Item "dist\windows\READ ME FIRST.txt","dist\THIRD-PARTY-NOTICES.txt" $stage
          Compress-Archive -Path $stage -DestinationPath "dist\LoopsMaster-$v-Windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: LoopsMaster-Windows
          path: dist/LoopsMaster-*-Windows.zip
